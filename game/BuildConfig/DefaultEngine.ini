[Configuration]
BasedOn=..\UDKGame\Config\DefaultEngine.ini

[URL]
Protocol=unreal
Name=Player
Map=DunDefEntry.udk
LocalMap=DunDefEntry.udk
TransitionMap=DunDefTransition.udk
MapExt=udk
EXEName=UDKGame.exe
DebugEXEName=DEBUG-UDKGame.exe
SaveExt=usa
Port=7777
GameName=Dungeon Defenders
GameNameShort=DunDef

; This conversion is cooked in INT only. Native startup reads this section.
[SystemSettings]
GameLanguageOverride=INT

[Engine.Engine]
Language=INT
GameViewportClientClassName=DD1Archipelago.APViewportClient
DefaultOnlineSubsystemName=
bDevAlwaysUseSteamworks=false

[OnlineSubsystemSteamworks.OnlineSubsystemSteamworks]
GameLanguageOverride=INT
bUseVAC=false

[Core.System]
ScriptPaths=..\..\TotalConversions\DD1ArchipelagoCurrent\Script
FRScriptPaths=..\..\TotalConversions\DD1ArchipelagoCurrent\ScriptFinalRelease
+SeekFreePCPaths=..\..\TotalConversions\DD1ArchipelagoCurrent\CookedPC
+Paths=..\..\TotalConversions\DD1ArchipelagoCurrent\CookedPCConsole

[UnrealEd.EditorEngine]
EditPackagesInPath=..\..\TotalConversions\DD1ArchipelagoCurrent\ProbeSource
EditPackagesOutPath=..\..\TotalConversions\DD1ArchipelagoCurrent\Script
FRScriptOutputPath=..\..\TotalConversions\DD1ArchipelagoCurrent\ScriptFinalRelease
+EditPackages=DD1Archipelago

[Engine.ScriptPackages]
+NonNativePackages=DD1Archipelago

[Engine.StartupPackages]
+Package=DD1Archipelago
-Package=OnlineSubsystemGameSpy

[Engine.PackagesToAlwaysCook]
+Package=DD1Archipelago
-Package=OnlineSubsystemGameSpy
