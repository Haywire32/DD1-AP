# Dungeon Defenders Archipelago 0.4.0

name: PlayerName
description: Dungeon Defenders Archipelago 0.4.0

game: Dungeon Defenders
requires:
  version: 0.6.7

Dungeon Defenders:
  # Choose 2 to 8 heroes. You must own any DLC heroes you select.
  # Names: apprentice, squire, huntress, monk, adept, countess, ranger, initiate,
  # barbarian, series_ev, summoner, jester, hermit, gunwitch, warden, guardian.
  # Choose only one from each pair: apprentice/adept, squire/countess,
  # huntress/ranger, monk/initiate. Include at least one builder.
  active_heroes: [apprentice, squire, huntress, monk]

  # Beat a set amount of campaign maps to unlock "The Summit". Beat this level on a set difficulty to win.

  # Choose the amount of levels you need to beat to unlock the final map "The Summit". Valid numbers are 1 to 11.
  summit_required_maps: 11
  
  # Choose the map difficulty that is required to progress towards "The Summit" unlock. Beating higher difficulties counts for any lower ones. For example, you have to beat all 11 maps on at least medium to unlock "The Summit". Choose one: easy, medium, hard, or insane
  summit_unlock_difficulty: medium
  
  # Choose the difficulty required for "The Summit" to beat the Archipelago goal. Choose one: easy, medium, hard, or insane
  summit_goal_difficulty: hard

  # Multiplies all normal gameplay experience after DD1 applies its own bonuses. Choose 1, 2, 4, 6, 8, or 10.
  experience_multiplier: 1
  
  progression_balancing:
    normal: 50
    
  accessibility:
    full: 50
    minimal: 0
