[Configuration]
BasedOn=..\UDKGame\Config\DefaultEngine.ini

; Inherit the complete installed game/engine defaults, including graphics,
; startup packages and movies. Keep AP activation in the default layer so an
; engine INI update cannot replace it with the ordinary DD1 viewport.
[Engine.Engine]
GameViewportClientClassName=DD1Archipelago.APViewportClient
bDevAlwaysUseSteamworks=false
; Match the tested Local-only runtime even when inherited game defaults name
; one of DD1's online providers. Compiled dependency packages remain intact.
-DefaultOnlineSubsystemName=DDOnlineSub.DDOnlineSubsystem
-DefaultOnlineSubsystemName=OnlineSubsystemGameSpy.OnlineSubsystemGameSpy
-DefaultOnlineSubsystemName=OnlineSubsystemSteamworks.OnlineSubsystemSteamworks

[Engine.StartupPackages]
-Package=OnlineSubsystemGameSpy

[Engine.PackagesToAlwaysCook]
-Package=OnlineSubsystemGameSpy

[UnrealEd.EditorEngine]
EditPackagesInPath=..\..\TotalConversions\%TOTALCONVERSION%\APSrc
EditPackagesOutPath=..\..\TotalConversions\%TOTALCONVERSION%\Script
FRScriptOutputPath=..\..\TotalConversions\%TOTALCONVERSION%\ScriptFinalRelease
AutoSaveDir=..\..\TotalConversions\%TOTALCONVERSION%\Autosaves
+EditPackages=DD1Archipelago

[Core.System]
ScriptPaths=..\..\TotalConversions\%TOTALCONVERSION%\Script
FRScriptPaths=..\..\TotalConversions\%TOTALCONVERSION%\ScriptFinalRelease
; Retain the installed game's content paths and cooked-package fallback.
+SeekFreePCPaths=..\..\TotalConversions\%TOTALCONVERSION%\CookedPC
